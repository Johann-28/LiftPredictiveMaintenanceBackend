version: '3.8'

services:
  # API Gateway
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/gateway_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - auth-service
      - dashboard-service
      - elevator-service
      - maintenance-service
      - monitoring-service
    networks:
      - elevator-network

  # Authentication Service
  auth-service:
    build: ./auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    networks:
      - elevator-network

  # Dashboard Service
  dashboard-service:
    build: ./dashboard_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/dashboard_db
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    networks:
      - elevator-network

  # Elevator Service
  elevator-service:
    build: ./elevator_service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/elevator_db
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379/3
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - elevator-network

  # Maintenance Service
  maintenance-service:
    build: ./maintenance_service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/maintenance_db
      - REDIS_URL=redis://redis:6379/4
    depends_on:
      - postgres
      - redis
    networks:
      - elevator-network

  # Monitoring Service
  monitoring-service:
    build: ./monitoring_service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/monitoring_db
      - INFLUXDB_URL=http://influxdb:8086
      - REDIS_URL=redis://redis:6379/5
    depends_on:
      - postgres
      - influxdb
      - redis
    networks:
      - elevator-network

  # Databases
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - elevator-network

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - elevator-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - elevator-network

  influxdb:
    image: influxdb:2.7
    environment:
      INFLUXDB_DB: elevator_metrics
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: password
      INFLUXDB_USER: user
      INFLUXDB_USER_PASSWORD: password
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - elevator-network

  # Nginx (Load Balancer)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway
    networks:
      - elevator-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  influxdb_data:

networks:
  elevator-network:
    driver: bridge
